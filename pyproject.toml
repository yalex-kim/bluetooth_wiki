[project]
name = "bluetooth-wiki-agent"
version = "0.1.0"
description = "Bluetooth Spec Wiki Agent — internal agent loop with HTTP and MCP entry points"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "mcp>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# Vector arm of the v2 hybrid search. Heavy (pulls torch); everything else —
# including v2's ripgrep arm — works without it. Tip: install a CPU-only
# torch first to skip CUDA wheels:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
embeddings = [
    "sentence-transformers>=3.0",
]

[project.scripts]
bluetooth-wiki-agent-http = "server.http:main"
bluetooth-wiki-agent-mcp = "server.mcp:main"
bluetooth-spec-qa-http = "server.qa_http:main"
bluetooth-spec-qa-mcp = "server.qa_mcp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "server*", "search*", "eval*", "qa*"]
exclude = ["wiki*", "sources*", "scripts*", "search.index*", "qa.index*"]
